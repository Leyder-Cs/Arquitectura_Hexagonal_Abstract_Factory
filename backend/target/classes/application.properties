# ===================================================================
# CONFIGURACIÓN DE LA APLICACIÓN ACORTADOR DE ENLACES
# ===================================================================
spring.application.name=acortador-enlaces
server.port=8080

# Configuración de MongoDB (Persistencia NoSQL)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/acortadordb}

# Configuración de Redis (Caché en memoria y TTL en tiempo real)
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# URL base para la construcción de los enlaces acortados
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Configuración de logs
logging.level.com.example.demo=DEBUG
logging.level.org.springframework.data.mongodb=INFO
logging.level.org.springframework.data.redis=INFO
